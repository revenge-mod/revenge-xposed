name: Release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: Version name (e.g. 1.7.0)
        required: true
        type: string
      versionCode:
        description: Version code (e.g. 1700), also used as the release tag
        required: true
        type: number

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep in sync with `javaVersion` in gradle/libs.versions.toml.
  JAVA_VERSION: 25

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION_NAME: ${{ inputs.versionName }}
      VERSION_CODE: ${{ inputs.versionCode }}
    steps:
      - name: Validate inputs
        run: |
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid versionName: $VERSION_NAME"
            exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid versionCode: $VERSION_CODE"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Bump version
        run: |
          sed -i -E \
            -e "s/^(\s*versionCode = ).*/\1$VERSION_CODE/" \
            -e "s/^(\s*versionName = ).*/\1\"$VERSION_NAME\"/" \
            app/build.gradle.kts
          git diff app/build.gradle.kts

          if git diff --quiet app/build.gradle.kts; then
            echo "Version unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: bump version to $VERSION_NAME ($VERSION_CODE)" app/build.gradle.kts
            git push
          fi

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The KEYSTORE secret is required for releases."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/signing-key.jks"

      - name: Build APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/signing-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir dist
          mv app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          mv app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          ls -l dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION_CODE" >/dev/null 2>&1; then
            echo "::error::Release $VERSION_CODE already exists."
            exit 1
          fi
          gh release create "$VERSION_CODE" \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION_NAME" \
            --generate-notes \
            dist/app-debug.apk dist/app-release.apk
